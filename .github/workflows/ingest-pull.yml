name: ingest pull

on:
  pull_request_target:
    types: [labeled]

env:
  NODE_VERSION: 22

jobs:
  security:
    name: Check permissions for pull request runs
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'safe to test')
    steps:
      - run: |
          echo "Security checks passed!"

  test:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        STAGES: [dev]
    steps:
      - name: 👀 Checkout Code
        uses: actions/checkout@v6

      - name: 🛠 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔑 Setup Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_GITHUB_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true

      - name: 🛠 Setup mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: 🔐 Decrypt CI users allow-list
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_PRIVATE_KEY }}
        run: sops decrypt src/config/users.ci.sops.json > src/config/users.json

      - name: 📚 Lint Code
        run: bun x oxlint

      - name: 🧪 Run Ingest Tests
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_PRIVATE_KEY }}
          STAGE: ${{ matrix.STAGES }}
        run: sops exec-env --same-process .env.ci.sops.yaml "bun test --timeout 120000"

  license:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout Code
        uses: actions/checkout@v6

      - name: 🛠 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 📚 Run License Check
        run: bun x license-compliance -f json -r detailed
