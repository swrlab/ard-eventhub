name: validation bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/connect/validation/**
      - src/schemas/**
      - src/utils/validation/**
      - src/cli/bench-validation.ts
      - justfile
      - mise.toml
      - mise.lock
      - .github/workflows/validation-bench.yml
  push:
    branches:
      - main
    paths:
      - src/connect/validation/**
      - src/schemas/**
      - src/utils/validation/**
      - src/cli/bench-validation.ts
      - justfile
      - mise.toml
      - mise.lock
      - .github/workflows/validation-bench.yml

permissions:
  contents: read

concurrency:
  group: validation-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: Benchmark inbox validation
        run: just bench-validation

      - name: Publish results
        run: |
          {
            echo '## Inbox validation'
            echo
            echo 'Each sample is one Bun process running `planInboxMessage` on a fixed payload (`src/cli/bench-validation.ts`). `accept` is the hyperfine reference.'
            echo
            cat .local/validation-bench.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: validation-bench
          path: .local/validation-bench.json
          if-no-files-found: error
