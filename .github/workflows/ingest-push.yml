name: ingest push

on:
  push:
    branches:
      - feature/*
      - dev/*
  pull_request:
    types: [closed]
  workflow_dispatch:

env:
  IMAGE_NAME: ard-eventhub-europe-west3/ingest
  IMAGE_NAME_ARD_COMMON: voice-feeds-playout-search/ard-eventhub/ingest
  REGISTRY_DOMAIN: europe-west3-docker.pkg.dev
  GCP_ARD_COMMON_PROJECT_ID: ard-common

jobs:
  security:
    name: Check permissions for action runs
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - run: |
          echo "Security checks passed!"

  test:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout Code
        uses: actions/checkout@v6

      - name: 🛠 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔑 Setup Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_GITHUB_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true

      - name: 🛠 Setup mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: 🔐 Decrypt CI users allow-list
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_PRIVATE_KEY }}
        run: sops decrypt keys/users.ci.sops.json > src/config/users.json

      - name: 📚 Lint Code
        run: bun x oxlint

      - name: 🧪 Run Ingest Tests
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_PRIVATE_KEY }}
          STAGE: dev
        run: sops exec-env --same-process .env.ci.sops.yaml "bun test --timeout 120000"

  docker:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      VERSION: ${{ steps.push.outputs.VERSION }}
    steps:
      - name: 👀 Checkout Code
        uses: actions/checkout@v6

      - name: 🛠 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile --production

      - name: 🔑 Setup Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_GITHUB_SERVICE_ACCOUNT_KEY }}

      - name: 🛠 Setup mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: 🔑 Login to Registry
        run: 'gcloud auth configure-docker $REGISTRY_DOMAIN'

      - name: 🚧 Building docker image
        run: 'docker build ./ --file ./Dockerfile -t image'

      - name: 🏷 Tagging & Pushing docker
        id: push
        run: |
          # Strip git ref prefix from version
          BRANCH=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && BRANCH=$(echo $BRANCH | sed -e 's/^v//')

          # Add custom wrapper syntax
          PACKAGE_VERSION=$(cat ./package.json | jq '.version' | tr -d '"')
          VERSION=$PACKAGE_VERSION-g${{ github.run_number }}

          # Set registry
          IMAGE_URI=$REGISTRY_DOMAIN/${{ secrets.GCP_PROJECT_ID }}/$IMAGE_NAME:$VERSION

          # Push image to registry
          docker tag image $IMAGE_URI
          docker push $IMAGE_URI

          # Update vars
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Print vars
          echo "## Docker Version Tag" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment Version
        uses: peter-evans/create-or-update-comment@v5
        if: github.event.pull_request.merged == true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Docker container is ready!

            VERSION:
            ```
            ${{ steps.push.outputs.VERSION }}
            ```

      - name: 🔓 Decrypt ARD Common service account key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_PRIVATE_KEY }}
        run: sops --output keys/gcp-ard-common.json --decrypt keys/gcp-ard-common.ci.sops.json

      - name: 🔑 Login to Registry (ard-common)
        run: |
          # uses the decrypted service account key (gar writer in ard-common)
          # instead of the Eventhub SA, since that project sits outside this one
          KEY="${GITHUB_WORKSPACE}/keys/gcp-ard-common.json"

          # google-github-actions/auth exports credential-file overrides via
          # GITHUB_ENV; those beat activate-service-account and
          # docker-credential-gcloud, so docker would keep pushing as the
          # Eventhub SA. Retarget current + later steps.
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=${KEY}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${KEY}"
            echo "GOOGLE_GHA_CREDS_PATH=${KEY}"
            echo "CLOUDSDK_CORE_PROJECT=${GCP_ARD_COMMON_PROJECT_ID}"
            echo "CLOUDSDK_PROJECT=${GCP_ARD_COMMON_PROJECT_ID}"
            echo "GCLOUD_PROJECT=${GCP_ARD_COMMON_PROJECT_ID}"
            echo "GCP_PROJECT=${GCP_ARD_COMMON_PROJECT_ID}"
            echo "GOOGLE_CLOUD_PROJECT=${GCP_ARD_COMMON_PROJECT_ID}"
          } >> "$GITHUB_ENV"

          export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="${KEY}"
          export GOOGLE_APPLICATION_CREDENTIALS="${KEY}"
          export GOOGLE_GHA_CREDS_PATH="${KEY}"
          export CLOUDSDK_CORE_PROJECT="${GCP_ARD_COMMON_PROJECT_ID}"

          gcloud auth activate-service-account --key-file "${KEY}" --quiet
          gcloud auth configure-docker "$REGISTRY_DOMAIN" --quiet

      - name: 🏷 Tagging & Pushing docker (ard-common)
        id: push-ard-common
        run: |
          TAG=$REGISTRY_DOMAIN/$GCP_ARD_COMMON_PROJECT_ID/${{ env.IMAGE_NAME_ARD_COMMON }}:${{ steps.push.outputs.VERSION }}
          docker tag image $TAG
          docker push $TAG --quiet

          echo "## Docker Version Tag (ard-common)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 👋 Logout
        if: always()
        run: |
          gcloud auth revoke --all --quiet || true
          docker logout || true
          rm -f keys/gcp-ard-common.json
