# Local Eventhub Connect users (RFC §7).
# Hash is bcrypt of the well-known local password `local` (`just nats-passwd`).
# Production: same shape, hashes from `nats server passwd`, plaintext in sops.
# Assign the hash to a variable (unquoted `$2a$…` is a bcrypt literal). User
# lines then reference `$DEV_PW` so `$JS.API.>` on the same line cannot eat `$2a$`.
# Quoted `$JS.…` subjects are literal (NATS only expands unquoted `$VAR`).

DEV_PW: $2a$11$czVyCYIZ7bzideGbBFH/nOa5wManKB1EG6SaUUdqhzQHXoBIgQ7yq

authorization {
	users: [
		{
			user: "pub-swr-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: { allow: ["inbox.urn:ard:institution:a3004ff924ece1a2"] }
				subscribe: { allow: ["feedback.urn:ard:institution:a3004ff924ece1a2"] }
			}
		}

		{
			user: "pub-shared-playout-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: {
					allow: [
						"inbox.urn:ard:institution:a3004ff924ece1a2"
						"inbox.urn:ard:institution:b71c0e4d9a25f338"
					]
				}
				subscribe: {
					allow: [
						"feedback.urn:ard:institution:a3004ff924ece1a2"
						"feedback.urn:ard:institution:b71c0e4d9a25f338"
					]
				}
			}
		}

		{
			user: "sub-ard-sounds-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				subscribe: { allow: ["radio.*.track.playing", "radio.*.track.next"] }
				publish: { deny: [">"] }
			}
		}

		{
			user: "svc-sidecar"
			password: $DEV_PW
			permissions: {
				subscribe: { allow: ["inbox.>", "$JS.API.>", "_INBOX.>"] }
				publish: { allow: ["radio.>", "feedback.>", "plugin.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
			}
		}

		{
			user: "svc-adapter-radioplayer"
			password: $DEV_PW
			allowed_connection_types: ["STANDARD"]
			permissions: {
				subscribe: { allow: ["plugin.radioplayer.>", "$JS.API.>", "_INBOX.>"] }
				publish: { allow: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
			}
		}

		{
			user: "svc-ingest"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: { allow: ["inbox.>"] }
				subscribe: { deny: [">"] }
			}
		}
	]
}
