# Local Eventhub Connect NATS. Single node, no TLS.
# MQTT and NATS share this process. MQTT listens on :1883.
# JetStream store_dir comes from NATS_JS_STORE (`just nats-up` / `just nats-up-docker`).
# Users: nats-users.conf is a symlink to components/users/nats-users.conf.

server_name: eventhub-nats-dev

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
	store_dir: $NATS_JS_STORE
}

mqtt {
	listen: 0.0.0.0:1883

	# Redeliver an unacknowledged QoS 1 or 2 message after this long.
	# https://docs.nats.io/learn/mqtt/qos-sessions-and-retained
	ack_wait: "5m"
}

# Browser tail. Plaintext is local only. The page connects as sub-ui, no password.
websocket {
	listen: 0.0.0.0:9222
	no_tls: true
}

include nats-users.conf
