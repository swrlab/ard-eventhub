# NanoMQ hop for GCP. Hand-apply with infra/nanomq/deployment.yaml.
# No sqlite block: events published while the bridge is down are lost by design.

mqtt {
	property_size = 32
	max_packet_size = 256KB
	max_mqueue_len = 2048
	retry_interval = 10s
	keepalive_multiplier = 1.25
}

listeners.ssl {
	bind = "0.0.0.0:8883"
	keyfile = "/etc/nanomq/certs/tls.key"
	certfile = "/etc/nanomq/certs/tls.crt"
	cacertfile = "/etc/nanomq/certs/ca.crt"
	verify_peer = false
	fail_if_no_peer_cert = false
}

auth {
	allow_anonymous = false
	no_match = deny
	deny_action = disconnect
	password = {include "/etc/nanomq/nanomq_pwd.conf"}
}

log {
	to = [console]
	level = warn
}
