# NanoMQ hop for local Eventhub Connect dual-write.
# No sqlite block: nothing is persisted, retained messages die with the process.

mqtt {
	property_size = 32
	max_packet_size = 256KB
	max_mqueue_len = 2048
	retry_interval = 10s
	keepalive_multiplier = 1.25
}

listeners.tcp {
	bind = "0.0.0.0:1883"
}

auth {
	allow_anonymous = true
	no_match = allow
	deny_action = ignore
}

log {
	to = [console]
	level = warn
}
