# websecure (:443) serves eventhub-connect of every stage, registry (:5000) zot, beszel (:8081) the
# Beszel hub. All terminate TLS with our certificates, see the ingressroute.yaml next to each service.
# https://github.com/traefik/traefik-helm-chart/blob/v40.1.0/traefik/values.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
spec:
  valuesContent: |-
    ports:
      registry:
        port: 5000
        expose:
          default: true
        exposedPort: 5000
        protocol: TCP
        http:
          tls:
            enabled: true
        # A large layer upload outlasts the default 60s read timeout. zot sets none either.
        transport:
          respondingTimeouts:
            readTimeout: 0
      beszel:
        port: 8081
        expose:
          default: true
        exposedPort: 8081
        protocol: TCP
        http:
          tls:
            enabled: true
