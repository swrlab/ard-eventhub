apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry
      containers:
        - name: victoria-logs-mcp
          # Repo: https://github.com/VictoriaMetrics/mcp-victorialogs
          # Upstream ghcr.io/victoriametrics/mcp-victorialogs, copied in by just registry-sync.
          image: registry.registry.svc:5000/victoriametrics/mcp-victorialogs:v1.9.0
          imagePullPolicy: IfNotPresent
          # https://github.com/VictoriaMetrics/mcp-victorialogs#configuration
          env:
            - name: VL_INSTANCE_ENTRYPOINT
              value: http://victoria-logs:9428
            # Streamable HTTP at /mcp.
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: ':8081'
            - name: MCP_LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
