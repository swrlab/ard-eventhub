# https://vector.dev/docs/reference/configuration/

data_dir: /vector-data-dir

api:
  enabled: false

sources:
  kubernetes_logs:
    type: kubernetes_logs

transforms:
  kubernetes_fields:
    type: remap
    inputs:
      - kubernetes_logs
    source: |
      # The NixOS host config sets the zone label; machines are named eventhub-connect-<zone>.
      .zone = .kubernetes.node_labels."topology.kubernetes.io/zone"
      .machine = if is_string(.zone) { "eventhub-connect-" + string!(.zone) } else { null }
      .k8s_namespace = .kubernetes.pod_namespace
      .k8s_pod_name = .kubernetes.pod_name
      .k8s_container_name = .kubernetes.container_name
      .k8s_container_image = .kubernetes.container_image
      .k8s_node_name = .kubernetes.pod_node_name
      del(.stream)
      del(.file)
      del(.kubernetes)
      del(.source_type)
      if is_string(.message) {
        parsed, err = parse_json(.message, max_depth: 3)
        if err == null && is_object(parsed) {
          . = merge!(., parsed)
          .is_json = true
        } else {
          .is_json = false
        }
      }

sinks:
  # https://docs.victoriametrics.com/victorialogs/data-ingestion/vector/
  victoria_logs:
    type: http
    inputs:
      - kubernetes_fields
    uri: 'http://victoria-logs:9428/insert/jsonline?_stream_fields=machine,k8s_namespace,k8s_pod_name,k8s_container_name&_msg_field=message&_time_field=timestamp'
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    # Survives a VictoriaLogs restart without dropping lines.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    healthcheck:
      enabled: false
