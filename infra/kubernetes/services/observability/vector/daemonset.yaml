apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
    spec:
      serviceAccountName: vector
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: registry
      containers:
        - name: vector
          # Repo: https://github.com/vectordotdev/vector
          # Upstream docker.io/timberio/vector, copied in by just registry-sync.
          image: registry.registry.svc:5000/timberio/vector:0.61.0-distroless-libc
          imagePullPolicy: IfNotPresent
          args: ['--config-dir', '/etc/vector/']
          env:
            # kubernetes_logs reads only the pods on its own node.
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          # Root, read-only, to read the kubelet's pod log files.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
              add: ['DAC_READ_SEARCH']
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        # Checkpoints and the disk buffer outlive the pod.
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
