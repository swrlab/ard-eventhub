# Vector, VictoriaLogs, and its MCP server, one set per machine, shared by every stage. Nothing here
# is machine specific: Vector reads the zone from the node label.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - victoria-logs
  - victoria-logs-mcp
  - vector

components:
  - ../../components/registry-pull

labels:
  - pairs:
      app.kubernetes.io/instance: observability
