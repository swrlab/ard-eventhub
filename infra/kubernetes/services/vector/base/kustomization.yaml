# Vector DaemonSet: pod logs on this machine to the local VictoriaLogs.
# The namespace comes from platform/observability; the machine fields from the cluster layer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - daemonset.yaml

configMapGenerator:
  - name: vector-config
    files:
      - vector.yaml
  # Overridden per machine with `behavior: merge`.
  - name: vector-env
    literals:
      - VECTOR_MACHINE=unset
      - VECTOR_ZONE=unset

labels:
  - pairs:
      app.kubernetes.io/name: vector
      app.kubernetes.io/component: log-shipper
    includeSelectors: false
