apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate avoids two pods writing to the same ReadWriteOnce PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          # Repo: https://github.com/project-zot/zot
          # Pulled from ghcr.io so the registry can start empty. Not mirrored.
          image: ghcr.io/project-zot/zot:v2.1.22
          imagePullPolicy: IfNotPresent
          args: ['serve', '/etc/zot/config.yaml']
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # zot answers 401 on /v2/ for unauthenticated probes, so only the listener is checked.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: htpasswd
              mountPath: /etc/zot/htpasswd
              subPath: htpasswd
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: config
          configMap:
            name: registry-config
        # Key `htpasswd` (bcrypt lines) from passwd.sops.yaml, decrypted into the bundle by just k8s-*.
        - name: htpasswd
          secret:
            secretName: registry-htpasswd
