# Single-node VictoriaLogs, one per machine. The namespace comes from platform/observability.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: victoria-logs
      app.kubernetes.io/component: logs
    includeSelectors: false
