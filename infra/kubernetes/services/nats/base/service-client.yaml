# In-cluster clients (eventhub-connect). Cluster, MQTT, and WebSocket reach other machines and
# browsers through hostPorts, not this Service.
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: eventhub
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: nats
      port: 4222
      targetPort: nats
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: monitor
      protocol: TCP
    - name: websocket
      port: 9222
      targetPort: websocket
      protocol: TCP
