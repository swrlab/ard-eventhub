# One NATS server per stage per machine. Not applied on its own: an environment layer
# adds routes.conf, the host ports, and the namespace; a cluster layer adds the server identity.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - service-client.yaml
  - service-headless.yaml
  - statefulset.yaml

components:
  - ../users

configMapGenerator:
  - name: nats
    files:
      - nats.conf
