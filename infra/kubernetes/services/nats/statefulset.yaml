# JetStream identity is NATS_SERVER_NAME (eventhub-connect-<zone>-<stage>) plus this volume. Replacing the disk and
# keeping the name is a RAFT incident. Container ports are the same in every stage; environments/shared
# maps cluster, MQTT, and WebSocket to the stage's hostPorts so dev, test, and prod share a machine.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      # Written here, not by includeTemplates in kustomization.yaml: that would also add labels to
      # volumeClaimTemplates, which a running StatefulSet cannot change.
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: eventhub
        app.kubernetes.io/component: broker
    spec:
      # components/machine sets the zone from clusters/<host>. Until then the pod stays Pending.
      nodeSelector:
        topology.kubernetes.io/zone: unset
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry
      containers:
        - name: nats
          # Upstream docker.io/library/nats, copied in by just registry-sync.
          image: registry.registry.svc:5000/library/nats:2.14.6
          imagePullPolicy: IfNotPresent
          args: ['-c', '/etc/nats/nats.conf']
          # STAGE and PORT_* from the stage layer.
          envFrom:
            - configMapRef:
                name: eventhub-stage
          # NATS only substitutes whole values, so the kubelet builds them here: $(VAR) expands from
          # envFrom and earlier entries. Each route host must resolve to its machine; the three stage
          # names of one machine share its IP because the ports differ.
          env:
            # components/machine sets ZONE by name.
            - name: ZONE
              value: unset
            - name: NATS_SERVER_NAME
              value: eventhub-connect-$(ZONE)-$(STAGE)
            - name: NATS_CLUSTER_NAME
              value: eventhub-$(STAGE)
            - name: NATS_CLUSTER_ADVERTISE
              value: eventhub-connect-$(ZONE)-$(STAGE).swr.ard:$(PORT_CLUSTER)
            # From environments/<stage>/nats-route.sops.yaml, one value per stage on every machine.
            # It goes into a URL, so it must be URL-safe (openssl rand -hex 32).
            - name: NATS_ROUTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-route
                  key: password
            - name: NATS_ROUTE_BAD
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-bad-$(STAGE).swr.ard:$(PORT_CLUSTER)
            - name: NATS_ROUTE_STG
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-stg-$(STAGE).swr.ard:$(PORT_CLUSTER)
            - name: NATS_ROUTE_MNZ
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-mnz-$(STAGE).swr.ard:$(PORT_CLUSTER)
            # Same size on every stage. The store ceiling is only memory-backed streams; GOMEMLIMIT is
            # about 80% of the limit so the garbage collector runs before the cgroup kills the process.
            - name: NATS_MAX_MEMORY_STORE
              value: 128M
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: nats
              containerPort: 4222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              # Stage host port, set by environments/shared from ConfigMap eventhub-stage.
              hostPort: 0
              protocol: TCP
            - name: mqtts
              containerPort: 8883
              # Stage host port, set by environments/shared from ConfigMap eventhub-stage.
              hostPort: 0
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
            - name: websocket
              containerPort: 9222
              # Stage host port, set by environments/shared from ConfigMap eventhub-stage.
              hostPort: 0
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats
            defaultMode: 0444
        # Stage certificate from environments/<stage>/tls.sops.yaml. NATS reads it only at start, so
        # restart the pod after a change (kubectl rollout restart statefulset/nats). The image has no shell.
        - name: tls
          secret:
            secretName: eventhub-tls
            defaultMode: 0444
        - name: pid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/part-of: eventhub
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
