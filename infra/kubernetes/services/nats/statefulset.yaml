# JetStream identity is NATS_SERVER_NAME (<stage>-<zone>) plus this volume. Replacing the disk and
# keeping the name is a RAFT incident. Container ports are the same in every stage; environments/shared
# maps cluster, MQTT, and WebSocket to the stage's hostPorts so dev, test, and prod share a machine.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: eventhub
        app.kubernetes.io/component: broker
    spec:
      # clusters/<machine> sets the zone. Until then the pod stays Pending.
      nodeSelector:
        topology.kubernetes.io/zone: unset
      serviceAccountName: nats
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          # Pinned in infra/kubernetes/external-images.txt (docker.io/library/nats).
          image: nats:2.14.6
          imagePullPolicy: IfNotPresent
          args: ['-c', '/etc/nats/nats.conf']
          # STAGE and PORT_* from the stage layer.
          envFrom:
            - configMapRef:
                name: eventhub-stage
          # NATS only substitutes whole values, so the kubelet builds them here: $(VAR) expands from
          # envFrom and earlier entries. Each route host must resolve to its machine; the three stage
          # names of one machine share its IP because the ports differ.
          env:
            # Must stay first: clusters/<machine> replaces env/0.
            - name: ZONE
              value: unset
            - name: NATS_SERVER_NAME
              value: $(STAGE)-$(ZONE)
            - name: NATS_CLUSTER_NAME
              value: eventhub-$(STAGE)
            - name: NATS_CLUSTER_ADVERTISE
              value: eventhub-connect-$(ZONE)-$(STAGE).swr.cn.ard.de:$(PORT_CLUSTER)
            # Created by hand per namespace like nats-tls; the pod waits until it exists. It goes
            # into a URL, so it must be URL-safe (openssl rand -hex 32).
            - name: NATS_ROUTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-route
                  key: password
            - name: NATS_ROUTE_BAD
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-bad-$(STAGE).swr.cn.ard.de:$(PORT_CLUSTER)
            - name: NATS_ROUTE_STG
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-stg-$(STAGE).swr.cn.ard.de:$(PORT_CLUSTER)
            - name: NATS_ROUTE_MNZ
              value: nats://eventhub-route:$(NATS_ROUTE_PASSWORD)@eventhub-connect-mnz-$(STAGE).swr.cn.ard.de:$(PORT_CLUSTER)
          ports:
            - name: nats
              containerPort: 4222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              protocol: TCP
            - name: mqtts
              containerPort: 8883
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
            - name: websocket
              containerPort: 9222
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats
            defaultMode: 0444
        # Created by hand per namespace (see docs/development/certificates.md). The image has no
        # shell, so the pod waits in CreateContainerConfigError until this secret exists.
        - name: tls
          secret:
            secretName: nats-tls
            defaultMode: 0444
        - name: pid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/part-of: eventhub
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
