# Governing Service for the single-pod StatefulSet. Routes between machines use host DNS, not this name.
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: nats
      port: 4222
      targetPort: nats
      protocol: TCP
    - name: cluster
      port: 6222
      targetPort: cluster
      protocol: TCP
