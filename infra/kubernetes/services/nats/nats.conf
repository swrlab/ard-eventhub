# Shared by every stage and machine. Nothing in this file names a zone, a stage, or a host port.
# NATS substitutes an environment variable only when it is the whole value, so statefulset.yaml
# builds these from STAGE, ZONE, and PORT_CLUSTER:
#   NATS_SERVER_NAME        JetStream identity, <stage>-<zone>. Changing it orphans the volume.
#   NATS_CLUSTER_NAME       eventhub-<stage>. Keeps the stages from routing together.
#   NATS_CLUSTER_ADVERTISE  This machine's stage hostname and cluster hostPort, which other machines dial.
#   NATS_ROUTE_PASSWORD     From Secret nats-route. Every route must present it.
#   NATS_ROUTE_BAD|STG|MNZ  Route URLs with credentials.
#   NATS_MAX_MEMORY_STORE   JetStream memory-store ceiling. 512M on prod, 128M on dev and test.
# Users come from ./users.

server_name: $NATS_SERVER_NAME

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

pid_file: "/var/run/nats/nats.pid"

jetstream {
	store_dir: /data
	max_memory_store: $NATS_MAX_MEMORY_STORE
	max_file_store: 4G
}

cluster {
	name: $NATS_CLUSTER_NAME
	listen: 0.0.0.0:6222
	advertise: $NATS_CLUSTER_ADVERTISE
	# The cluster port is a public hostPort. Without this, anyone who reaches it joins the cluster
	# as a peer and bypasses the users in nats-users.conf.
	authorization {
		user: eventhub-route
		password: $NATS_ROUTE_PASSWORD
	}
	# Routes do not fall back to the authorization above; each URL carries the credentials itself.
	routes: [
		$NATS_ROUTE_BAD
		$NATS_ROUTE_STG
		$NATS_ROUTE_MNZ
	]
}

mqtt {
	listen: 0.0.0.0:8883
	stream_replicas: 3
	tls {
		cert_file: "/etc/nats/tls/tls.crt"
		key_file: "/etc/nats/tls/tls.key"
	}
}

websocket {
	listen: 0.0.0.0:9222
	tls {
		cert_file: "/etc/nats/tls/tls.crt"
		key_file: "/etc/nats/tls/tls.key"
	}
}

include nats-users.conf
