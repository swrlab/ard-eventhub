# One NATS server per stage per machine. Applied only through environments/<stage>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - service-client.yaml
  - service-headless.yaml
  - statefulset.yaml
  # Self-signed placeholder. just k8s-* decrypts tls.sops.yaml and deletes the plaintext.
  - tls.yaml

components:
  - users

configMapGenerator:
  - name: nats
    files:
      - nats.conf

labels:
  - pairs:
      app.kubernetes.io/name: nats
      app.kubernetes.io/part-of: eventhub
      app.kubernetes.io/component: broker
