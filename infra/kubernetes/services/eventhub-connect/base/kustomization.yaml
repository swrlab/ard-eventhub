# eventhub-connect next to the NATS server of the same namespace. Not applied on its own: the
# environment layer adds the image, the host port, and the browser-facing URLs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: eventhub-connect
    literals:
      - NATS_URL=nats://nats:4222
      - NATS_MONITOR_URL=http://nats:8222
      - NATS_USERS_CONF=/etc/nats-users/nats-users.conf
