# Operator UI, MCP, feed loader, and inbox validation in one process.
# Recreate, because the environment layer gives the pod a hostPort that a surge pod cannot share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-connect
  labels:
    app.kubernetes.io/name: eventhub-connect
    app.kubernetes.io/part-of: eventhub
    app.kubernetes.io/component: connect
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eventhub-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventhub-connect
        app.kubernetes.io/part-of: eventhub
        app.kubernetes.io/component: connect
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eventhub-connect
          # Placeholder name; the environment layer pins the real image with `images:`.
          image: eventhub-connect
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: eventhub-connect
            # NATS_USER, NATS_PASSWORD, ARD_FEED_URL. Created from sops, never committed.
            - secretRef:
                name: eventhub-connect
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          # The HTTP server listens before NATS and the feed are ready, so this only proves the
          # process is up. Swap in a readiness endpoint once connect exposes one.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # The users board reads the broker's users file (usernames and ACLs, never the hash).
            - name: nats-users
              mountPath: /etc/nats-users
              readOnly: true
      volumes:
        - name: nats-users
          configMap:
            name: nats
            items:
              - key: nats-users.conf
                path: nats-users.conf
