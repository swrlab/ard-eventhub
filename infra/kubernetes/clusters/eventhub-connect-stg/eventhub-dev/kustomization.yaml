apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-dev

resources:
  - ../../../environments/dev

configMapGenerator:
  # NATS_SERVER_NAME is the JetStream identity. Never rename it on a running volume.
  - name: nats-zone
    behavior: merge
    literals:
      - NATS_SERVER_NAME=dev-stg
      - NATS_CLUSTER_ADVERTISE=eventhub-connect-stg-dev.swr.cn.ard.de:26222
  # Browser and MQTT endpoints. Hostnames must be SANs of this stage's nats-tls certificate.
  - name: eventhub-connect
    behavior: merge
    literals:
      - NATS_MQTT_URL=mqtts://eventhub-connect-stg-dev.swr.cn.ard.de:28883
      - NATS_WS_URL=wss://eventhub-connect-stg-dev.swr.cn.ard.de:29222

# Applying this bundle to the wrong machine leaves NATS Pending instead of joining with a wrong identity.
patches:
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          topology.kubernetes.io/zone: stg
