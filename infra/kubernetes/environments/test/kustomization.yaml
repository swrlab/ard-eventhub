# Eventhub test on every machine, in namespace eventhub-test.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-test

resources:
  # Secrets nats-route, eventhub-tls, and eventhub-connect. just k8s-* decrypts the *.sops.yaml files
  # and deletes the plaintext. eventhub-tls is the stage certificate, written by just tls-store.
  - nats-route.yaml
  - tls.yaml
  - connect.yaml

components:
  - ../shared

configMapGenerator:
  - name: eventhub-stage
    literals:
      - STAGE=test
      - PORT_CLUSTER=16222
      - PORT_MQTT=18883
      - PORT_WS=19222

# Pin once the connect image is built and pushed to the registry.
images:
  - name: eventhub-connect
    newName: registry.registry.svc:5000/eventhub-connect
    newTag: 2026-11-12-15-44-28--v3.0.0-beta.3

labels:
  - pairs:
      app.kubernetes.io/instance: eventhub-test

# env/8 and env/9 are NATS_MAX_MEMORY_STORE and GOMEMLIMIT. env/0 stays ZONE.
patches:
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: 128M
      - op: replace
        path: /spec/template/spec/containers/0/env/9/value
        value: 400MiB
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  # Operator UI hostnames of this stage on every machine, both domains of the stage certificate.
  - target:
      kind: IngressRoute
      name: eventhub-connect
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostRegexp(`^eventhub-connect-[a-z]+-test\.swr\.(ard|cn\.ard\.de)$`)
