# Eventhub test on every machine, in namespace eventhub-test.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-test

resources:
  # Secret nats-route. just k8s-* decrypts nats-route.sops.yaml and deletes the plaintext.
  - nats-route.yaml

components:
  - ../shared

configMapGenerator:
  - name: eventhub-stage
    literals:
      - STAGE=test
      - PORT_CLUSTER=16222
      - PORT_MQTT=18883
      - PORT_WS=19222
      - PORT_UI=14173

# Pin once the connect image is built and pushed to the registry.
images:
  - name: eventhub-connect
    newName: eventhub-connect
    newTag: test

labels:
  - pairs:
      app.kubernetes.io/instance: eventhub-test

# env/8 and env/9 are NATS_MAX_MEMORY_STORE and GOMEMLIMIT. env/0 stays ZONE.
patches:
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: 128M
      - op: replace
        path: /spec/template/spec/containers/0/env/9/value
        value: 400MiB
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
