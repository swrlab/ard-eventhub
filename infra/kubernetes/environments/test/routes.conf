# Included inside the cluster block of services/nats/base/nats.conf.
# The test cluster port is 16222 on every machine. Each name must resolve to its machine;
# the dev, test, and prod names of one machine share its IP because the ports differ.
routes: [
	nats://eventhub-connect-bad-test.swr.cn.ard.de:16222
	nats://eventhub-connect-stg-test.swr.cn.ard.de:16222
	nats://eventhub-connect-mnz-test.swr.cn.ard.de:16222
]
