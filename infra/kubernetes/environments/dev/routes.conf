# Included inside the cluster block of services/nats/base/nats.conf.
# The dev cluster port is 26222 on every machine. Each name must resolve to its machine;
# the dev, test, and prod names of one machine share its IP because the ports differ.
routes: [
	nats://eventhub-connect-bad-dev.swr.cn.ard.de:26222
	nats://eventhub-connect-stg-dev.swr.cn.ard.de:26222
	nats://eventhub-connect-mnz-dev.swr.cn.ard.de:26222
]
