# Eventhub dev on every machine, in namespace eventhub-dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-dev

resources:
  # Secrets nats-route and eventhub-tls. just k8s-* decrypts the *.sops.yaml files and deletes the
  # plaintext. eventhub-tls is the stage certificate, written by just tls-store.
  - nats-route.yaml
  - tls.yaml

components:
  - ../shared

configMapGenerator:
  - name: eventhub-stage
    literals:
      - STAGE=dev
      - PORT_CLUSTER=26222
      - PORT_MQTT=28883
      - PORT_WS=29222

# Pin once the connect image is built and pushed to the registry.
images:
  - name: eventhub-connect
    newName: eventhub-connect
    newTag: dev

labels:
  - pairs:
      app.kubernetes.io/instance: eventhub-dev

# env/8 and env/9 are NATS_MAX_MEMORY_STORE and GOMEMLIMIT. env/0 stays ZONE.
patches:
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: 128M
      - op: replace
        path: /spec/template/spec/containers/0/env/9/value
        value: 400MiB
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  # Operator UI hostnames of this stage on every machine, both domains of the stage certificate.
  - target:
      kind: IngressRoute
      name: eventhub-connect
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostRegexp(`^eventhub-connect-[a-z]+-dev\.swr\.(ard|cn\.ard\.de)$`)
