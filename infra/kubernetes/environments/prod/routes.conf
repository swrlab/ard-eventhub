# Included inside the cluster block of services/nats/base/nats.conf.
# The prod cluster port is 6222 on every machine. Each name must resolve to its machine;
# the dev, test, and prod names of one machine share its IP because the ports differ.
routes: [
	nats://eventhub-connect-bad-prod.swr.cn.ard.de:6222
	nats://eventhub-connect-stg-prod.swr.cn.ard.de:6222
	nats://eventhub-connect-mnz-prod.swr.cn.ard.de:6222
]
