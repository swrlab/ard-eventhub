# Eventhub prod on every machine, in namespace eventhub-prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-prod

resources:
  # Secret nats-route. just k8s-* decrypts nats-route.sops.yaml and deletes the plaintext.
  - nats-route.yaml

components:
  - ../shared

configMapGenerator:
  - name: eventhub-stage
    literals:
      - STAGE=prod
      - PORT_CLUSTER=6222
      - PORT_MQTT=8883
      - PORT_WS=9222
      - PORT_UI=4173

# Pin once the connect image is built and pushed to the registry.
images:
  - name: eventhub-connect
    newName: eventhub-connect
    newTag: prod

labels:
  - pairs:
      app.kubernetes.io/instance: eventhub-prod
