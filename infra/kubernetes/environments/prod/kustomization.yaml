# Eventhub prod: NATS and eventhub-connect in namespace eventhub-prod, on all three machines.
# Applied through clusters/<machine>/eventhub-prod, which adds the server identity.
# Host ports: cluster 6222, MQTT 8883, WebSocket 9222, operator UI 4173.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-prod

resources:
  - namespace.yaml
  - ../shared
  - ../../services/nats/base
  - ../../services/eventhub-connect/base

patches:
  - path: host-ports.yaml

configMapGenerator:
  - name: nats
    behavior: merge
    files:
      - routes.conf
  # The cluster layer merges NATS_SERVER_NAME and NATS_CLUSTER_ADVERTISE into this map.
  - name: nats-zone
    literals:
      - NATS_CLUSTER_NAME=eventhub-prod

# Pin once the connect image is built and pushed to the registry.
images:
  - name: eventhub-connect
    newName: eventhub-connect
    newTag: prod

labels:
  - pairs:
      environment: prod
    includeSelectors: false
