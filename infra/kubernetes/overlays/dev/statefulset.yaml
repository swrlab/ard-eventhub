# Three pods, one cluster. They may share a node. emptyDir dies with the pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: eventhub
    app.kubernetes.io/component: broker
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  minReadySeconds: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: eventhub
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: nats
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.14.6
          imagePullPolicy: IfNotPresent
          args: ['-c', '/etc/nats/nats.conf']
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Kubelet expands $(SERVER_NAME). NATS cannot splice $SERVER_NAME into a longer string.
            - name: CLUSTER_ADVERTISE
              value: "$(SERVER_NAME).nats-headless.eventhub-dev.svc.cluster.local:6222"
          ports:
            - name: nats
              containerPort: 4222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              protocol: TCP
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
            - name: websocket
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats
            defaultMode: 0444
        - name: pid
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir:
            sizeLimit: 2Gi
