# Three NATS pods in one cluster. No hostname anti-affinity, so one node can run all three.
# nats-users.conf is a copy of infra/nats/nats-users.conf. Kustomize will not
# read a file outside this directory. `just nats-k8s-build` fails if they differ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventhub-dev

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - service-headless.yaml
  - statefulset.yaml
  - pdb.yaml

configMapGenerator:
  - name: nats
    files:
      - nats.conf
      - nats-users.conf

labels:
  - pairs:
      environment: dev
    includeSelectors: false
