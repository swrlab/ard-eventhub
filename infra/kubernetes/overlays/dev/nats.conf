# Dev cluster: three pods in one Kubernetes cluster, including a single node.
# SERVER_NAME is the pod name (nats-0, nats-1, nats-2).
# Plaintext MQTT. Users are nats-users.conf in this directory (password `local`).

server_name: $SERVER_NAME

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

pid_file: "/var/run/nats/nats.pid"

jetstream {
	store_dir: /data
	max_memory_store: 128M
	max_file_store: 1G
}

cluster {
	name: eventhub
	listen: 0.0.0.0:6222
	routes: [
		nats://nats-0.nats-headless:6222
		nats://nats-1.nats-headless:6222
		nats://nats-2.nats-headless:6222
	]
}

mqtt {
	listen: 0.0.0.0:1883
	stream_replicas: 3
}

include nats-users.conf
