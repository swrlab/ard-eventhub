# Dev cluster: three pods in one Kubernetes cluster, including a single node.
# SERVER_NAME is the pod name (nats-0, nats-1, nats-2).
# Plaintext MQTT. Users are components/users/nats-users.conf. The password is only in sops.

server_name: $SERVER_NAME

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

pid_file: "/var/run/nats/nats.pid"

jetstream {
	store_dir: /data
	max_memory_store: 128M
	max_file_store: 1G
}

cluster {
	name: eventhub
	listen: 0.0.0.0:6222
	# NATS substitutes a variable only when it is the whole value. The pod
	# env sets CLUSTER_ADVERTISE to <pod>.nats-headless.eventhub-dev.svc.cluster.local:6222.
	advertise: $CLUSTER_ADVERTISE
	routes: [
		nats://nats-0.nats-headless.eventhub-dev.svc.cluster.local:6222
		nats://nats-1.nats-headless.eventhub-dev.svc.cluster.local:6222
		nats://nats-2.nats-headless.eventhub-dev.svc.cluster.local:6222
	]
}

mqtt {
	listen: 0.0.0.0:1883
	stream_replicas: 3
}

# Browser tail. Plaintext matches this overlay's MQTT listener.
websocket {
	listen: 0.0.0.0:9222
	no_tls: true
}

include nats-users.conf
