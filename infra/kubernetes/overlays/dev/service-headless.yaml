# Governing headless Service. Pod A records exist only when clusterIP is None:
# nats-0.nats-headless.eventhub-dev.svc.cluster.local
# publishNotReadyAddresses keeps those records while the pods are still unready,
# which is what lets them find each other and form the JetStream quorum.
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: eventhub
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: nats
      port: 4222
      targetPort: nats
      protocol: TCP
    - name: cluster
      port: 6222
      targetPort: cluster
      protocol: TCP
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
