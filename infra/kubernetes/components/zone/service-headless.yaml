# Governing service for the single-pod StatefulSet. Zone routes use node DNS, not this name.
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: eventhub
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: nats
      port: 4222
      targetPort: nats
      protocol: TCP
    - name: cluster
      port: 6222
      targetPort: cluster
      protocol: TCP
