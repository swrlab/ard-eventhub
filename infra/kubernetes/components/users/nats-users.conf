# Eventhub Connect users (RFC §7).
# Same users for local NATS and every Kubernetes environment.
# Publishers and services share one bcrypt hash (`$DEV_PW`). The plaintext is only in sops.
# `sub-ui` has no password: it is the browser tail, and it
# may only open a WebSocket and subscribe to verified `radio.>` events.
# Assign the hash to a variable (unquoted `$2a$…` is a bcrypt literal). User
# lines then reference `$DEV_PW` so `$JS.API.>` on the same line cannot eat `$2a$`.
# Quoted `$JS.…` subjects are literal (NATS only expands unquoted `$VAR`).

DEV_PW: $2a$11$czVyCYIZ7bzideGbBFH/nOa5wManKB1EG6SaUUdqhzQHXoBIgQ7yq

authorization {
	users: [
		{
			user: "pub-swr-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: { allow: ["inbox.urn:ard:institution:a3004ff924ece1a2"] }
				subscribe: { allow: ["feedback.urn:ard:institution:a3004ff924ece1a2"] }
			}
		}

		{
			user: "pub-shared-playout-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: {
					allow: [
						"inbox.urn:ard:institution:a3004ff924ece1a2"
						"inbox.urn:ard:institution:b71c0e4d9a25f338"
					]
				}
				subscribe: {
					allow: [
						"feedback.urn:ard:institution:a3004ff924ece1a2"
						"feedback.urn:ard:institution:b71c0e4d9a25f338"
					]
				}
			}
		}

		{
			user: "sub-ard-sounds-2026-06-26"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				subscribe: { allow: ["radio.*.track.playing", "radio.*.track.next"] }
				publish: { deny: [">"] }
			}
		}

		# Browser tail. Username only. Publish still requires a password on the other users.
		{
			user: "sub-ui"
			allowed_connection_types: ["WEBSOCKET"]
			permissions: {
				subscribe: { allow: ["radio.>"] }
				publish: { deny: [">"] }
			}
		}

		# Connect process: validation, plugin fan-out and pull, feed KV, operator-board reads.
		# The browser tail is `sub-ui`. `feedback.>` is the live rejection ring.
		{
			user: "svc-eventhub-connect"
			password: $DEV_PW
			permissions: {
				subscribe: { allow: ["inbox.>", "feedback.>", "plugin.>", "$JS.API.>", "_INBOX.>"] }
				publish: { allow: ["radio.>", "feedback.>", "plugin.>", "$KV.ARD_FEED.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
			}
		}

		{
			user: "svc-ingest"
			password: $DEV_PW
			allowed_connection_types: ["MQTT"]
			permissions: {
				publish: { allow: ["inbox.>"] }
				subscribe: { deny: [">"] }
			}
		}
	]
}
