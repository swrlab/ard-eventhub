# Zone bad. Apply via overlays/test/bad or overlays/prod/bad, not this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/zone
  - ../../components/users

patches:
  - path: zone-patch.yaml

configMapGenerator:
  - name: nats
    files:
      - nats.conf

labels:
  - pairs:
      zone: bad
    includeSelectors: false
