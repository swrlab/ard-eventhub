# Zone stg. Same routes on every zone; advertise is this node.
# connect-bad, connect-stg, and connect-mnz must resolve to the three nodes.
# Test and prod share this file. Each environment's DNS points the names at its own nodes.
# Users are the nats-users Secret. include is relative to this file.

server_name: connect-stg

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

pid_file: "/var/run/nats/nats.pid"

jetstream {
	store_dir: /data
	max_memory_store: 512M
	max_file_store: 8G
}

cluster {
	name: eventhub
	listen: 0.0.0.0:6222
	advertise: connect-stg:6222
	routes: [
		nats://connect-bad:6222
		nats://connect-stg:6222
		nats://connect-mnz:6222
	]
}

mqtt {
	listen: 0.0.0.0:8883
	stream_replicas: 3
	tls {
		cert_file: "/etc/nats/tls/tls.crt"
		key_file: "/etc/nats/tls/tls.key"
	}
}

include users/nats-users.conf
