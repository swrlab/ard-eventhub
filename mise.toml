# Toolchain pins for local + CI.
# Tasks stay in Just; secrets stay on sops exec-env.
# Install: https://mise.jdx.dev → `mise install`
# Activate (optional): eval "$(mise activate zsh)"
#
# Plain [tools] pins only — no env/hooks — so this file loads
# without `mise trust` (avoids needing a writable ~/.local/state).

[tools]
just = "1.58.0"
sops = "3.13.3"
